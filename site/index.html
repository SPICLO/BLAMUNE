<body>

<!-- Serpent de fond : rampe stylisee et interactive (curseur / souris / doigt).
     Il se masque des qu'un champ est actif pour ne jamais se retrouver
     au-dessus du clavier (connexion, inscription, chat). -->
<div id="rampe" aria-hidden="true">
  <div class="rampe-lean">
    <div class="rampe-mvt">
      <svg viewBox="0 0 264 96" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rampeDeg" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#059669"/>
            <stop offset="0.45" stop-color="#10b981"/>
            <stop offset="0.78" stop-color="#22d3ee"/>
            <stop offset="1" stop-color="#38bdf8"/>
          </linearGradient>
          <linearGradient id="rampeReflet" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
          </linearGradient>
        </defs>

        <!-- queue qui s'affine -->
        <path class="rampe-queue" d="M4 76 C 9 72, 13 68, 19 63" fill="none" stroke="url(#rampeDeg)" stroke-width="4.5" stroke-linecap="round"/>

        <!-- corps ondule -->
        <path class="rampe-corps" d="M19 63 C 45 25, 81 21, 107 47 C 133 73, 159 77, 183 53 C 203 33, 217 29, 233 37" fill="none" stroke="url(#rampeDeg)" stroke-width="20" stroke-linecap="round"/>

        <!-- ecailles qui glissent le long du corps -->
        <path class="rampe-file" d="M19 63 C 45 25, 81 21, 107 47 C 133 73, 159 77, 183 53 C 203 33, 217 29, 233 37" fill="none" stroke="url(#rampeReflet)" stroke-width="7" stroke-dasharray="12 28" stroke-linecap="round" opacity="0.85"/>

        <!-- tete : elle pivote vers le pointeur -->
        <g class="rampe-tete">
          <ellipse cx="245" cy="37" rx="16" ry="13.5" fill="url(#rampeDeg)"/>
          <ellipse cx="235" cy="31" rx="3.6" ry="4" fill="#f8fafc" opacity="0.9"/>
          <circle class="rampe-pupille" cx="236" cy="31" r="1.8" fill="#0b1020"/>
          <ellipse cx="249" cy="31.5" rx="4.6" ry="5.2" fill="#f8fafc"/>
          <circle class="rampe-pupille" cx="250.5" cy="31.5" r="2.5" fill="#0b1020"/>
          <circle cx="252" cy="29.6" r="1.1" fill="#ffffff"/>
          <path d="M234 45 C 240 49.5, 249 50.5, 258 48" fill="none" stroke="rgba(11,16,32,0.5)" stroke-width="1.8" stroke-linecap="round"/>
          <g class="rampe-langue">
            <path d="M258 47 L 274 45 M258 47 L 273 52 M274 45 L 281 43 M274 45 L 279 49" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
</div>

<!-- ECRAN D'AUTHENTIFICATION -->
<div id="ecranAuth">
  <div class="auth-box">
    <div class="auth-avatar"><img src="logo.png" alt="BLAMUNE"></div>
    <h2>Bienvenue sur BLAMUNE</h2>
    <p class="auth-sous">Connecte-toi pour garder ton historique et personnaliser ton experience.</p>

    <div id="authPrincipal">

      <div id="authFormLogin" class="auth-form">
        <div class="champ">
          <input id="authEmail" type="email" placeholder="Ton email" autocomplete="email" maxlength="100" aria-label="Ton email">
        </div>
        <div class="champ">
          <input id="authMdp" type="password" placeholder="Mot de passe" autocomplete="current-password" maxlength="100" aria-label="Mot de passe">
        </div>
        <button id="btnLogin" class="auth-btn" type="button">Se connecter</button>
        <p class="auth-err" id="authErrLogin"></p>
        <p class="auth-switch">Pas encore de compte ? <a href="#" id="authShowRegister">Creer un compte</a></p>
      </div>

      <div id="authFormRegister" class="auth-form" style="display:none">
        <div class="champ">
          <input id="authPseudoReg" type="text" placeholder="Choisis un pseudo" autocomplete="username" maxlength="30" aria-label="Choisis un pseudo">
        </div>
        <div class="champ">
          <input id="authEmailReg" type="email" placeholder="Ton email" autocomplete="email" maxlength="100" aria-label="Ton email">
        </div>
        <div class="champ">
          <input id="authMdpReg" type="password" placeholder="Choisis un mot de passe" autocomplete="new-password" maxlength="100" aria-label="Choisis un mot de passe">
        </div>
        <button id="btnRegister" class="auth-btn" type="button">Creer mon compte</button>
        <p class="auth-err" id="authErrRegister"></p>
        <p class="auth-switch">Deja un compte ? <a href="#" id="authShowLogin">Se connecter</a></p>
      </div>

      <div class="auth-sep"><span>ou</span></div>
      <button id="btnInvite" class="auth-btn auth-invite" type="button">Continuer en tant qu'invite</button>
      <p class="auth-note">L'invite ne sauvegarde pas tes messages.</p>

    </div>

    <div id="authSuccess" class="auth-success" aria-live="polite">
      <div class="success-ring">
        <svg class="success-check" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle class="success-check-circle" cx="32" cy="32" r="23"></circle>
          <path class="success-check-mark" d="M20 32 28.5 40 44 24"></path>
        </svg>
      </div>
      <p class="success-texte" id="authSuccessTexte"></p>
    </div>
  </div>
</div>

<!-- HEADER + CHAT (caches tant que pas auth) -->
<div id="appContenu">
<header id="tete">
  <div class="infos">
    <div class="avatar avatar-bot" aria-hidden="true"><img src="logo.png" alt=""></div>
    <div class="titres">
      <h1>BLAMUNE</h1>
      <div class="statut" id="statut">
        <span class="point" id="pointStatut"></span>
        <span id="texteStatut">Connexion...</span>
      </div>
    </div>
  </div>
  <div id="boutons">
    <span id="noteInvite" style="display:none;color:var(--texte-doux);font-size:11px;margin-right:8px;" aria-hidden="true">Mode invite</span>
    <div class="segmente" role="group" aria-label="Mode de l'IA">
      <div id="piluleMode" aria-hidden="true"></div>
      <button id="mode1" title="EGO : IA Gemini, conversation intelligente" aria-pressed="false" type="button">EGO</button>
      <button id="mode2" title="BLAMUNE : conversation decouverte" class="actif" aria-pressed="true" type="button">BLAMUNE</button>
    </div>
    <button id="btnDeconnexion" title="Deconnexion" type="button" style="display:none;margin-left:8px;background:var(--surface);border:1px solid var(--bordure);border-radius:8px;color:var(--texte-doux);padding:4px 10px;font-size:12px;cursor:pointer;">Deconnexion</button>
  </div>
</header>

<main id="chat" aria-live="polite"><noscript><p style="text-align:center;padding:40px;color:#9fb3c8;">JavaScript est requis pour utiliser BLAMUNE.</p></noscript></main>

<footer id="barre">
  <input id="zone" type="text" placeholder="Écris un message..." autocomplete="off" autocapitalize="sentences" spellcheck="false" maxlength="2000" enterkeyhint="send" aria-label="Écris un message">
  <button id="envoyer" title="Envoyer (Entrée)" type="button" aria-label="Envoyer">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</footer>
</div>

<script src="app.js"></script>
</body>
</html>
