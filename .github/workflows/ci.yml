name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier la syntaxe JavaScript
        run: |
          for f in server.js storage.js tests/run.js tests/unit.test.js \
                   site/app.js site/sw.js admin/admin.js; do
            echo "check $f"
            node --check "$f"
          done

      - name: Linter ESLint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test:unit

      - name: Tests d'integration
        run: npm test

      - name: Verification du deploiement (Python)
        run: python verifier_deploiement.py
