# BLAMUNE - stack cloud complete sur UN SEUL serveur.
#
#   navigateur -> server.js (Node) -> Ollama  (3b, GPU)
#                              \\-> bot.cpp  (service HTTP, regles locales)
#
# Les trois composants tourneNt sur la meme machine et partagent le reseau
# Docker interne : aucun aller-retour public, donc latence minimale.
#
# Demarrage :  docker compose up -d
# Journal :    docker compose logs -f
# Arret :      docker compose down

services:
  # ---------------------------------------------------------------- Ollama
  ollama:
    # Epinglee par version ET par digest.
    #
    # "latest" est un risque concret ici : l'image a ete reconstruite le
    # 2026-10-15, et Ollama publie frequemment. Un simple docker compose up
    # peut donc installer une version differente de celle avec laquelle on a
    # teste, sans que quoi que ce soit ne change dans le depot.
    #
    # Les deux services (ollama et ollama-init) doivent porter le MEME digest :
    # ils partagent le volume ollama_data.
    #   docker buildx imagetools inspect ollama/ollama:0.40.5
    image: ollama/ollama:0.40.5@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241
    container_name: blamune-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"   # binds sur localhost : pas public
    environment:
      # Modele charge dans la GPU et JAMAIS decharge : c'est le principal
      # gain de latence (un modele froid met 5 a 20 s a repondre).
      OLLAMA_KEEP_ALIVE: "-1"
      # Une seule requete a la fois : evite de saturer une petite GPU.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    # L'image ollama ne declare aucun HEALTHCHECK. Sans celui-ci,
    # depend_on ne peut pas attendre que le serveur soit reellement pret :
    # le serveur Node demarrerait pendant que le modele se charge encore et
    # les premieres conversations partiraient en repli.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ------------------------------------------------- Preparation du modele
  # Telecharge et Chauffe le modele une fois, puis sort. Sans ca, la
  # premiere conversation partirait d'un modele froid.
  ollama-init:
    # Meme digest que le service ollama ci-dessus, volontairement.
    image: ollama/ollama:0.40.5@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241
    container_name: blamune-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Telechargement de qwen2.5:3b..."
        ollama pull ${MODEL:-qwen2.5:3b}
        echo "Préchauffage..."
        ollama run ${MODEL:-qwen2.5:3b} "dis ok" >/dev/null 2>&1 || true
        echo "Modele pret."
    restart: "no"

  # ------------------------------------------------ Bot C++ (service HTTP)
  # Le bot lit le savoir via un volume NOMME partage avec le serveur (meme
  # hote Docker, donc systeme de fichiers local : c'est ce qui rend le
  # partage possible, contrairement a SQLite qui ne se partage pas sur un
  # systeme de fichiers reseau).
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: blamune-bot
    restart: unless-stopped
    # ollama-init est un conteneur one-shot : il SORT une fois le modele
    # telecharge et chauffe. Attendre "service_healthy" sur un service qui
    # se termine bloquerait le demarrage indefiniment ; la condition
    # correcte est "service_completed_successfully".
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      BOT_MODE: "2"
      BOT_GENRE: "feminin"
      BOT_NOM: "Visiteur"
      BOT_NOM_BOT: "BLAMUNE"
    volumes:
      - bot_data:/app
      # savoir.txt en LECTURE SEULE : le serveur est le seul ecrivain.
      - savoir_export:/savoir:ro

  # ---------------------------------------------------- Serveur Node (API)
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blamune-server
    restart: unless-stopped
    # Le serveur n'ecoute correctement qu'une fois le bot et Ollama pret.
    # Sans ces conditions, il demarre des le lancement de la stack et les
    # premiers messages tombent dans le repli hors ligne.
    depends_on:
      bot:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: "production"

      # --- Ollama local (primaire, illimite) ---
      API_PROVIDER: "ollama"
      API_URL: "http://ollama:11434/v1"
      API_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"
      API_MAX_TOKENS: "${API_MAX_TOKENS:-512}"
      API_TEMPERATURE: "0.7"

      # --- Bot C++ local (secours regles + apprentissage) ---
      BOT_SERVICE_URL: "http://bot:8090"
      # Dossier d'export du savoir partage avec le bot (volume Docker).
      SAVOIR_EXPORT_DIR: "/savoir"

      # --- Opt-in ---
      MEMOIRE_EXTRACTION: "${MEMOIRE_EXTRACTION:-1}"
      RECHERCHE_WEB: "${RECHERCHE_WEB:-0}"
      RATE_SEND_IP: "${RATE_SEND_IP:-30}"
      RATE_SEND_UID: "${RATE_SEND_UID:-20}"
      ADMIN_PSEUDO: "${ADMIN_PSEUDO:-admin}"

      # --- Persistance cloud (a definir si besoin) ---
      JSONBIN_API_KEY: "${JSONBIN_API_KEY:-}"
      JSONBIN_BIN_ID: "${JSONBIN_BIN_ID:-}"
    volumes:
      - server_data:/app
      # Export du savoir partage avec le bot (lecture seule pour le bot).
      - savoir_export:/savoir

volumes:
  ollama_data:
  bot_data:
  server_data:
  # Export du savoir (savoir.txt) partage entre le serveur (ecrivain) et
  # le bot (lecteur). Le serveur le regenere depuis SQLite a chaque
  # apprentissage.
  savoir_export: