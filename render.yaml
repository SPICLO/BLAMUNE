services:
  - type: web
    name: blamune
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    # PAS DE DISQUE PERSISTANT ICI, et c'est volontaire.
    # Render reserve les disques persistants aux plans payants (~0,25 $/Go/mois)
    # : declarer un bloc "disk:" ici ferait echouer le deploiement en plan free.
    #
    # La persistance est assuree par JSONBin (storage.js) : chaque ecriture est
    # poussee dans le cloud ~3 s plus tard, et le serveur restaure tout au
    # demarrage. Le disque local de Render est ephemere, ce qui n'a donc aucune
    # consequence tant que JSONBIN_API_KEY est definie.
    envVars:
      # ---------- Persistance (OBLIGATOIRE) ----------
      # Sans JSONBIN_API_KEY, storage.js ne sauvegarde rien : comptes, memoires,
      # historiques ET le savoir appris sont perdus a chaque redeloiement.
      # A definir dans le dashboard Render (jamais dans le depot).
      - key: JSONBIN_API_KEY
        sync: false
      # Fige le bin utilise. Fortement recommande : sans lui, le serveur
      # retrouve le bin a chaque demarrage en fouillant le compte, ce qui
      # consomme des requetes et peut rater si plusieurs bins existent.
      - key: JSONBIN_BIN_ID
        sync: false
      # ---------- Reponse IA en ligne (optionnel) ----------
      # Le bot fonctionne a 100 % en local : ces variables ne servent que si
      # tu relies le mode 1 a une API. Voir KEEPALIVE.md.
      - key: API_KEY
        sync: false
      - key: API_PROVIDER
        value: gemini
      - key: API_MODEL
        value: gemini-3.5-flash
      - key: API_URL
        value: https://generativelanguage.googleapis.com/v1beta
      # ---------- Reglages optionnels (defauts sains, a ajuster si besoin) ----------
      # Limites anti-abus (requetes par minute).
      - key: RATE_SEND_IP
        value: 30
      - key: RATE_SEND_UID
        value: 20
      # Attente max apres un "quota sature" (ms).
      - key: QUOTA_ATTENTE_MAX_MS
        value: 70000
      - key: QUOTA_ATTENTE_MSG_MS
        value: 10000
      # Extraction des faits par le modele (0 = regex seules).
      - key: MEMOIRE_EXTRACTION
        value: 1
      # Recherche web (0 = desactivee).
      - key: RECHERCHE_WEB
        value: 1
      # Pseudo du compte admin (defaut : admin).
      - key: ADMIN_PSEUDO
        value: admin
      # Mot de passe du compte admin cree au premier demarrage.
      #
      # A DEFINIR dans le dashboard (jamais dans le depot). Laissée vide,
      # le serveur genere un mot de passe aleatoire et l'affiche UNE FOIS
      # dans les journaux : c'est correct mais oblige a aller le chercher.
      # Un mot de passe ecrit ici serait public, comme tout le depot.
      - key: ADMIN_MDP
        sync: false
    healthCheckPath: /ping
