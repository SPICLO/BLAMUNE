services:
  - type: web
    name: blamune
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    # PAS DE DISQUE PERSISTANT ICI, et c'est volontaire.
    # Render reserve les disques persistants aux plans payants (~0,25 $/Go/mois)
    # : declarer un bloc "disk:" ici ferait echouer le deploiement en plan free.
    #
    # La persistance est assuree par JSONBin (storage.js) : chaque ecriture est
    # poussee dans le cloud ~3 s plus tard, et le serveur restaure tout au
    # demarrage. Le disque local de Render est ephemere, ce qui n'a donc aucune
    # consequence tant que JSONBIN_API_KEY est definie.
    envVars:
      # ---------- Persistance (OBLIGATOIRE) ----------
      # Sans JSONBIN_API_KEY, storage.js ne sauvegarde rien : comptes, memoires,
      # historiques ET le savoir appris sont perdus a chaque redeloiement.
      # A definir dans le dashboard Render (jamais dans le depot).
      - key: JSONBIN_API_KEY
        sync: false
      # Fige le bin utilise. Fortement recommande : sans lui, le serveur
      # retrouve le bin a chaque demarrage en fouillant le compte, ce qui
      # consomme des requetes et peut rater si plusieurs bins existent.
      - key: JSONBIN_BIN_ID
        sync: false
      # ---------- Reponse IA en ligne (optionnel) ----------
      # Le bot fonctionne a 100 % en local : ces variables ne servent que si
      # tu relies le mode 1 a une API. Voir KEEPALIVE.md.
      #
      # Principal : Gemini (cle gratuite : aistudio.google.com/app/apikey).
      # La cle elle-meme (API_KEY) se definit DANS LE DASHBOARD Render,
      # jamais ici. Attention a ne PAS y coller une cle OpenRouter
      # (sk-or-...) : l'API Gemini la refuse avec un 400, et la cascade
      # retombe silencieusement sur le bot local.
      - key: API_KEY
        sync: false
      - key: API_PROVIDER
        value: gemini
      - key: API_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: API_MODEL
        value: gemini-3.6-flash
      # Modele de secours (essayes si le principal renvoie une erreur :
      # quota sature, 429, indisponible...).
      - key: API_MODELS
        value: gemini-3.5-flash-lite
      - key: API_MAX_TOKENS
        value: 512
      - key: API_TEMPERATURE
        value: 0.7
      # ---------- Pool de secours (pilier invisible) ----------
      # Quand la cascade de cles Gemini est epuisee (cle morte, quota
      # partout, reseau), server.js tente automatiquement ces membres,
      # DANS L'ORDRE, pour EGO comme pour BLAMUNE. Le visiteur ne voit
      # rien : meme chat, meme UX. Celui qui repond redevient prioritaire
      # (sticky) : performance et survie ensemble.
      #   - groq : 30 requetes/min gratuites, modeles GPT-OSS tres rapides
      #     (cle gratuite sur console.groq.com/keys) ;
      #   - pollinations : sans aucun compte, modele libre GPT-OSS 20B
      #     (quotite anonyme : ~1 reponse / 30 s par IP de sortie).
      # A coller DANS LE DASHBOARD (rendable sync:false : il contient une
      # cle). Le raccourci : afficher_cles_render.bat imprime cette ligne
      # prete a copier depuis le .env local.
      - key: API_POOL
        sync: false
      - key: API_POOL_COOLDOWN_MS
        value: 60000
      - key: API_POOL_COOLDOWN_AUTH_MS
        value: 600000
      # ---------- Reglages optionnels (defauts sains, a ajuster si besoin) ----------
      # Limites anti-abus (requetes par minute). Resserrs pour le plan gratuit.
      - key: RATE_SEND_IP
        value: 20
      - key: RATE_SEND_UID
        value: 10
      # Attente max apres un "quota sature" (ms).
      - key: QUOTA_ATTENTE_MAX_MS
        value: 70000
      - key: QUOTA_ATTENTE_MSG_MS
        value: 10000
      # Extraction des faits par le modele (0 = regex seules).
      - key: MEMOIRE_EXTRACTION
        value: 1
      # Recherche web (0 = desactivee pour economiser les appels IA en free).
      - key: RECHERCHE_WEB
        value: 0
      # ---------- Memoire vectorielle du savoir (Qdrant, activable) ----------
      # Retrouve un fait du savoir.db meme si la question emploie d'autres
      # mots. La liaison Qdrant elle-meme se definit DANS LE DASHBOARD
      # (QDRANT_URL et QDRANT_API_KEY, sync:false). Tant qu'elle n'y est
      # pas, la valeur QDRANT_ACTIV=1 reste sans effet : qdrant_faits.js
      # reste inactif sans URL/cle, coute zero requete, zero risque.
      - key: QDRANT_ACTIV
        value: 1
      - key: QDRANT_COLLECTION
        value: blamune-faits
      - key: QDRANT_SEUIL
        value: 0.30
      # Vectorisation des faits par gemini-embedding-001 (gratuit, quota
      # D'EMBEDDING distinct du quota de chat ; sans l'activer : hachage
      # local 256 d, plus grossier mais zero quota). Absent = hachage local.
      - key: QDRANT_EMBED
        value: gemini
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Pseudo du compte admin (defaut : admin).
      - key: ADMIN_PSEUDO
        value: admin
      # Mot de passe du compte admin cree au premier demarrage.
      #
      # A DEFINIR dans le dashboard (jamais dans le depot). Laissée vide,
      # le serveur genere un mot de passe aleatoire et l'affiche UNE FOIS
      # dans les journaux : c'est correct mais oblige a aller le chercher.
      # Un mot de passe ecrit ici serait public, comme tout le depot.
      - key: ADMIN_MDP
        sync: false
    healthCheckPath: /ping
